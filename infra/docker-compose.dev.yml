# Entorno LOCAL únicamente. Producción corre en Render.
#
# Un solo servicio: MongoDB. Antes eran tres.
#   - n8n: se eliminó del proyecto (D18). Los horarios los maneja APScheduler dentro de FastAPI.
#   - Mailpit: servía para leer los magic links del login. Ya no hay correo saliente (D22).
#
# El puerto se publica sólo en 127.0.0.1: no queda accesible desde la red.
#
# CON AUTENTICACIÓN, aunque sea local. No es por miedo a que alguien entre: es
# porque el registro de auditoría es inmutable gracias a un ROL de MongoDB que
# no otorga `update` sobre esa colección, y un Mongo sin autenticación no aplica
# roles. Sin esto, la inmutabilidad sería una promesa que nadie puede probar
# hasta producción.
#
# Las credenciales de acá son de juguete y están versionadas a propósito: son de
# un contenedor que escucha en localhost. Las de Atlas van en MONGO_URL.
#
#   docker compose -f infra/docker-compose.dev.yml up -d
#   docker compose -f infra/docker-compose.dev.yml ps

name: seguimiento

services:
  mongo:
    image: mongo:7.0
    container_name: seguimiento-mongo
    restart: unless-stopped
    command: ["--bind_ip_all", "--auth"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      # Se corre una sola vez, cuando el volumen está vacío. Crea el rol y el
      # usuario con el que se conecta el backend.
      - ./mongo:/docker-entrypoint-initdb.d:ro
    environment:
      TZ: America/Argentina/Buenos_Aires
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root-local
      MONGO_INITDB_DATABASE: seguimiento
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - -u
        - root
        - -p
        - root-local
        - --authenticationDatabase
        - admin
        - --eval
        - db.adminCommand('ping').ok
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [seguimiento]

volumes:
  mongo_data:

networks:
  seguimiento:
    driver: bridge
