[project]
name = "seguimiento-agente"
version = "0.1.0"
description = "Agente local del Sistema de Seguimiento Comercial v2"
requires-python = "==3.12.*"

# El esqueleto (T0.5) sólo lee configuración y loguea. Nada de red, nada de
# navegador, nada de envío. Cada dependencia entra en el sprint que la usa:
#   playwright → fase 3, con el motor de envío
#   rumps      → fase 4, con el ícono de la barra de menú
# Una dependencia que todavía no usa nadie es una dependencia que nadie
# actualiza — y en el agente, además, es peso muerto dentro del .exe.
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    # El motor de envio (fase 4). El navegador se baja aparte, una vez por
    # maquina: `playwright install chromium`.
    "playwright>=1.48.0,<1.53",  # 1.53+ exige Node 20; hay Macs con Catalina (Node 18 es su techo)
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

# --- Ruff -------------------------------------------------------------------
# Misma configuración que backend/: un solo estilo en todo el Python del repo.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "W",
    "F",      # pyflakes
    "I",      # imports ordenados
    "UP",     # sintaxis moderna
    "B",      # bugbear
    "SIM",    # simplificaciones
    "ASYNC",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
# Sin tener que decorar cada test async. El bucle es async de punta a punta y
# el ruido de un decorador por test no aporta nada.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
