# Blueprint de Render.
#
# TRES servicios: backend, panel y el backup diario. Antes eran ocho.
#
# Qué se sacó y por qué (D17, D18):
#
#   staging (backend, frontend, n8n, backup)
#       Existía para probar sin romper producción. No hay usuarios del panel ni mensajes reales
#       saliendo, así que se prueba en producción. Lo que impide que una corrida alcance a un
#       cliente real no es el entorno: es `configuracion.destinos_permitidos` (regla R4).
#
#   n8n (producción y staging)
#       Hacía tres crons. Ahora los hace APScheduler dentro del proceso de FastAPI. A cambio
#       costaba dos servicios, dos discos, dos claves de cifrado, un runbook, tres commits de
#       depuración y un problema real: desde la versión 1.0 no tiene autenticación básica, y la
#       cuenta de dueño se la queda quien llegue primero a la URL.
#
# Todo eso está en docs/_historico/ si alguna vez hay que reconstruirlo.
#
# branch: main en todos. Es la única rama que se despliega: no hay develop porque no hay staging.
#
# autoDeploy: false: el despliegue lo dispara GitHub Actions después del CI, nunca Render por su
# cuenta. Sin esto, un push con los tests rotos llega igual a producción y el CI queda decorativo.

services:
  # ---------------- backend ----------------
  # Chequeo de salud por CÓDIGO DE ESTADO: /health devuelve 503 si Mongo no responde. Un chequeo
  # que contesta 200 con "ok: false" no lo lee nadie.
  #
  # MONGO_TIMEOUT_MS en 1500 y no en 2000: medido contra el backend levantado, con 2000 la peor
  # respuesta con Mongo caído fue de 2,503 s. El tiempo de espera del chequeo de Render no se
  # configura desde acá, así que el margen se gana bajando el timeout. Un chequeo que expira al
  # borde saca instancias sanas de rotación, y el síntoma es un servicio que "se reinicia solo".
  - type: web
    name: backend-produccion
    branch: main
    runtime: python
    rootDir: backend
    plan: starter
    region: oregon
    autoDeploy: false
    healthCheckPath: /health
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run fastapi run app/main.py --port $PORT
    envVars:
      - { key: ENTORNO,          value: produccion }
      - { key: MONGO_DB,         value: seguimiento }
      - { key: MONGO_TIMEOUT_MS, value: "1500" }
      - { key: MONGO_URL,        sync: false }   # usuario acotado a la base
      # Contraseña única del panel (D22). Sin Auth.js, sin magic links, sin correo saliente.
      - { key: PANEL_PASSWORD,   sync: false }
      # Firma la cookie de sesión del panel. La genera Render y nadie la ve.
      - { key: SESION_SECRET,    generateValue: true }
      - { key: SENTRY_DSN,       sync: false }

  # ---------------- panel ----------------
  # healthCheckPath apunta a /healthz y NO a "/" ni a /api/estado-backend:
  #
  #   "/"                  consulta al backend para pintar el diagnóstico. Con el backend caído,
  #                        Render vería un panel enfermo estando sano y lo sacaría de rotación:
  #                        dos servicios cayéndose por el precio de uno.
  #   /api/estado-backend  contesta 200 siempre, a propósito, porque es un dato para la pantalla.
  #                        Como sonda diría "sano" pase lo que pase.
  #   /healthz             200 sin tocar nada externo. Es la única de las tres que responde la
  #                        pregunta que hace un balanceador.
  #
  # BACKEND_URL va sin prefijo NEXT_PUBLIC_ a propósito: la lee sólo el servidor de Next. El
  # navegador nunca habla con el backend directo, así que el backend no necesita CORS.
  - type: web
    name: frontend-produccion
    branch: main
    runtime: node
    rootDir: frontend
    plan: starter
    region: oregon
    autoDeploy: false
    healthCheckPath: /healthz
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: BACKEND_URL,  sync: false }   # URL pública de backend-produccion
      - { key: SENTRY_DSN,   sync: false }

  # ---------------- backup ----------------
  # 08:00 UTC = 05:00 en Argentina. Se conserva del plan anterior porque ya está hecho, probado y
  # pago: bajarlo no ahorra nada y sí perdería la restauración verificada.
  #
  # AGE_RECIPIENT es la clave PÚBLICA: el servicio puede cifrar y no descifrar. La privada no está
  # acá ni en ningún servidor.
  - type: cron
    name: backup-produccion
    branch: main
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.backup
    dockerContext: ./infra
    plan: starter
    region: oregon
    schedule: "0 8 * * *"
    autoDeploy: false
    dockerCommand: /app/backup.sh
    envVars:
      - { key: ENTORNO, value: produccion }
      - { key: MONGO_URL,     sync: false }
      - { key: AGE_RECIPIENT, sync: false }
      - { key: R2_ENDPOINT,   sync: false }
      - { key: R2_BUCKET,     value: centonara-backups }
      - { key: R2_ACCESS_KEY_ID,     sync: false }
      - { key: R2_SECRET_ACCESS_KEY, sync: false }
