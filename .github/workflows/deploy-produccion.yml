name: Deploy a produccion

# Manual, disparado a mano desde Actions.
#
# NO hay ventana horaria ni días prohibidos (D19). La versión anterior fallaba después de las
# 12:00 y los viernes, porque protegía una corrida automática de las 13:00. Esa corrida ya no
# existe: el sistema arranca cuando el dueño aprieta un botón, así que un despliegue roto no manda
# mensajes equivocados — manda cero mensajes hasta que alguien lo dispare.
#
# Sigue siendo manual y no automático al pushear: el CI tiene que estar verde y alguien tiene que
# decidir que es momento.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Disparar los deploy hooks
        env:
          HOOKS: ${{ secrets.RENDER_DEPLOY_HOOKS_PRODUCCION }}
        run: |
          set -Eeuo pipefail
          if [ -z "${HOOKS:-}" ]; then
            echo "::error::Falta el secreto RENDER_DEPLOY_HOOKS_PRODUCCION."; exit 1
          fi
          echo "$HOOKS" | jq -r '.[]' | while read -r hook; do
            servicio=$(echo "$hook" | sed -E 's|.*/deploy/([^?]+).*|\1|')
            echo "→ $servicio"
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$hook")
            [ "$codigo" = "200" ] || { echo "::error::$servicio devolvió HTTP $codigo"; exit 1; }
          done

      - name: Recordatorio
        run: |
          echo "Desplegado. Si algo salió mal: docs/RUNBOOK-rollback.md"
          echo "El rollback vuelve la aplicación, NO los datos."
          echo
          echo "Si esto tocó el camino de envío, revisá que destinos_permitidos"
          echo "esté en los números de prueba antes de disparar una corrida."
