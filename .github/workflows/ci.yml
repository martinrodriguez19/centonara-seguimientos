name: CI

# Bloqueante para el merge. El despliegue NO se dispara acá: lo hace un workflow
# aparte, a mano, y sólo después de que esto pase en verde.
#
# Sólo `main`: no hay develop porque no hay staging (D17).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Si una parte del monorepo todavía no existe, su job queda en salteado en vez
  # de en rojo: un CI que siempre falla se aprende a ignorar, y para cuando
  # importa ya nadie lo mira.
  detectar:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.hay.outputs.backend }}
      frontend: ${{ steps.hay.outputs.frontend }}
      agente: ${{ steps.hay.outputs.agente }}
    steps:
      - uses: actions/checkout@v4
      - id: hay
        run: |
          test -f backend/pyproject.toml  && r=true || r=false; echo "backend=$r"  >> "$GITHUB_OUTPUT"
          test -f frontend/package.json   && r=true || r=false; echo "frontend=$r" >> "$GITHUB_OUTPUT"
          test -f agente/pyproject.toml   && r=true || r=false; echo "agente=$r"   >> "$GITHUB_OUTPUT"

  backend:
    needs: detectar
    if: needs.detectar.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    # Un Mongo de verdad. Los tests del esquema verifican que un índice único
    # RECHAZA el duplicado, y eso no se puede simular: o hay una base, o el test
    # se saltea y no prueba nada. Es lo que impide que un reintento mande el
    # mismo mensaje dos veces.
    #
    # CON AUTENTICACIÓN, igual que el compose local y que Atlas. No es opcional:
    # el test que verifica que un `update` sobre `auditoria` falla necesita que
    # MongoDB aplique roles, y un servidor sin `--auth` no los aplica. Sin esto
    # ese test pasaría en verde sin probar nada.
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root-ci
        options: >-
          --health-cmd "mongosh --quiet -u root -p root-ci --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Root: los tests crean y borran bases sueltas, y el de inmutabilidad crea
      # un rol restringido sobre la marcha para conectarse con él.
      MONGO_URL_TESTS: mongodb://root:root-ci@localhost:27017/?authSource=admin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Formato (ruff)
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      # La exigencia de 100% vive acá y no en un documento. Un umbral que sólo
      # está escrito lo baja cualquiera sin que nadie se entere; uno que rompe
      # el CI hay que discutirlo.
      #
      # Son los cinco archivos que, si fallan, mandan un mensaje que no debía
      # salir: la normalización de números, la máquina de estados, la cola, los
      # guardrails y el triage.
      # El resto del proyecto no tiene umbral a propósito: la cobertura por la
      # cobertura no sirve.
      - name: Cobertura de lo que no puede fallar
        run: |
          uv run pytest -q --cov-report=term             --cov=app.core.contactos             --cov=app.core.estados             --cov=app.core.cola             --cov=app.core.guardrails             --cov=app.core.triage             --cov-fail-under=100

  frontend:
    needs: detectar
    if: needs.detectar.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      # Sin version: la lee de "packageManager" en package.json, que es la forma
      # de que CI y las máquinas del equipo usen exactamente el mismo pnpm.
      #
      # package_json_file es OBLIGATORIO acá: la acción lo resuelve desde la raíz
      # del repositorio, y defaults.run.working-directory no la afecta — eso sólo
      # aplica a los pasos `run`, no a las entradas de una acción.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22          # el mínimo documentado, no el más nuevo
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck

  # El agente corre en la Mac del vendedor, pero se desarrolla en modo simulado
  # desde cualquier sistema (04-AGENTE §11). macOS es el que importa; los otros
  # dos están para que nadie del equipo quede bloqueado por su computadora.
  agente:
    needs: detectar
    if: needs.detectar.outputs.agente == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: agente } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      # Lint y formato una sola vez: en Windows el checkout usa CRLF y el
      # chequeo de formato daría un falso positivo.
      - name: Lint (ruff)
        if: matrix.os == 'ubuntu-latest'
        run: uv run ruff check .
      - name: Formato (ruff)
        if: matrix.os == 'ubuntu-latest'
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      # Los tests corren dentro del proceso de pytest; esto verifica lo otro:
      # que `python -m agente.main` arranque como programa en este sistema.
      - name: El módulo arranca como programa
        run: uv run python -m agente.main --version

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: El Compose local es válido
        run: docker compose -f infra/docker-compose.dev.yml config --quiet

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ningún secreto versionado
        run: |
          set -e
          malos=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|p12|pfx)$|(^|/)id_(rsa|ed25519)$' \
                  | grep -v '\.env\.example$' || true)
          if [ -n "$malos" ]; then
            echo "::error::Hay secretos versionados:"; echo "$malos"; exit 1
          fi
          echo "Sin secretos versionados."

  destinos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # R4 / D21: el sistema sólo escribe a numeros de configuracion.destinos_permitidos.
      # Esto reemplaza al job que verificaba que el codigo de envio no existiera: aquella regla
      # dejaba de aplicar el dia que el codigo se escribia, y a partir de ahi no quedaba ninguna
      # garantia estructural. Esta sigue sirviendo despues.
      - name: La lista de destinos no quedo abierta en el repositorio
        run: |
          set -euo pipefail

          # Los tests SI abren la lista a proposito: hay que poder ejercitar la rama
          # permisiva de destino_permitido(). Un fixture no se despliega a ningun lado,
          # asi que se excluyen. Lo que se busca es una lista abierta en codigo de
          # aplicacion, que es lo unico que puede llegar a produccion.
          abiertos=$(grep -rn 'destinos_permitidos' \
            --include='*.py' --include='*.json' \
            --exclude-dir='_historico' --exclude-dir='tests' --exclude='test_*.py' \
            . | grep '"[*]"' || true)

          if [ -n "$abiertos" ]; then
            echo "::error::Hay un destinos_permitidos abierto a todos, versionado:"
            echo "$abiertos"
            echo "Esa lista se cambia desde el panel, no desde el codigo."
            exit 1
          fi

          # Y el valor de fabrica tiene que seguir siendo la lista vacia, que significa
          # "a nadie". Un default abierto es la forma callada de que esto falle: nadie
          # configura nada y el sistema arranca pudiendo escribirle a cualquiera.
          if ! grep -q '"destinos_permitidos": \[\]' backend/app/core/configuracion.py; then
            echo "::error::El valor por defecto de destinos_permitidos dejo de ser la lista vacia."
            echo "Lista vacia significa 'a nadie'. Ver R4 / D21 en docs/03-REGLAS.md."
            exit 1
          fi

          echo "Sin listas abiertas en codigo de aplicacion, y el default sigue cerrado."
